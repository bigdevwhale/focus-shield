name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (python -c "from version import __version__; print(__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != version.py v$v" }

      - name: Build FocusShield.exe
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: FocusShield
          path: |
            dist/FocusShield.exe
            dist/FocusShield.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FocusShield ${{ github.ref_name }}
          body_path: .github/release-body.md
          files: |
            dist/FocusShield.exe
            dist/FocusShield.exe.sha256
